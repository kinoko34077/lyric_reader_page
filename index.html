<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="外部の歌詞テキストを読むための静的リーダー">
    <title>歌詞リーダー</title>
    <link rel="stylesheet" href="assets/css/reader.css?v=20260910-021">
  </head>
  <body>
    <header class="site-header" id="site-header">
      <a class="site-title" href="./">歌詞リーダー</a>
      <div class="header-tools"><button class="header-button" id="open-file-button" type="button">開く</button><input id="source-file" type="file" accept=".txt,.lyric.txt,.json,text/plain,application/json" hidden><button class="header-button" id="reload-button" type="button">再読込</button><p class="source-status" id="source-status" aria-live="polite">読み込み中…</p><button class="header-button" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">表示設定</button><button class="header-button" id="mode-switch" type="button">編集</button><button class="header-button" id="source-mode-switch" type="button" aria-pressed="false">Source</button></div>
    </header>

    <main class="reader-shell" id="reader-shell">
      <section class="reader-heading" id="reader-heading" aria-labelledby="song-title">
        <p class="eyebrow" id="song-artist"></p>
        <h1 id="song-title" contenteditable="false">歌詞リーダー</h1>
        <p class="song-description" id="song-description"></p>
      </section>
      <div class="draft-notice" id="draft-notice" hidden role="status"><span>未保存の編集があります</span><button class="action-button" id="draft-restore" type="button">復元</button><button class="action-button" id="draft-discard" type="button">破棄</button></div>
      <textarea class="source-editor" id="source-editor" hidden aria-label="Author Source" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      <article class="lyrics" id="lyrics" tabindex="0" aria-label="歌詞本文"></article>
      <p class="reader-error" id="reader-error" role="alert" hidden></p>
    </main>

    <aside class="settings" id="settings" aria-label="表示設定">
      <div class="settings-panel" id="settings-panel" hidden>
        <fieldset>
          <legend>本文</legend>
          <label><span>Variant</span><select id="variant-mode" aria-label="Variant"><option value="variant-A">Variant A</option></select></label>
          <label><span>字体</span><select id="kanji-mode"><option value="original">原字</option><option value="shinjitai">新字体</option></select></label>
          <label class="check-row"><input id="ruby-toggle" type="checkbox" checked><span>ルビを表示</span></label>
          <label class="check-row"><input id="vertical-toggle" type="checkbox"><span>縦書き</span></label>
          <button class="action-button" id="document-defaults-button" type="button">作品既定に戻す</button>
        </fieldset>
        <fieldset>
          <legend>文字サイズ</legend>
          <div class="size-controls"><button id="size-decrease" type="button" aria-label="文字を小さく">A−</button><output id="size-value">20px</output><button id="size-increase" type="button" aria-label="文字を大きく">A＋</button></div>
          <input id="size-range" type="range" min="14" max="32" step="1" value="20" aria-label="文字サイズ">
        </fieldset>
        <fieldset>
          <legend>配色</legend>
          <label><span>背景色</span><input id="background-color" type="color" value="#f5f0e6" aria-label="背景色"></label>
          <label><span>文字色</span><input id="text-color" type="color" value="#272522" aria-label="文字色"></label>
        </fieldset>
        <fieldset>
          <legend>フォント</legend>
          <label><span>書体</span><select id="font-family" aria-label="書体">
            <option value="serif">明朝</option>
            <option value="sans">ゴシック</option>
            <option value="mono">等幅</option>
            <option value="yu-mincho">游明朝</option>
            <option value="noto-serif">Noto Serif JP</option>
            <option value="noto-sans">Noto Sans JP</option>
            <option value="nishiki-teki">Nishiki-teki</option>
            <option value="custom">外部フォント</option>
          </select></label>
          <label class="font-url-row"><span>フォントURL</span><input id="font-url" type="url" inputmode="url" placeholder="https://…/font.woff2" aria-label="外部フォントURL"></label>
          <label class="check-row"><input id="remote-font-toggle" type="checkbox"><span>外部フォントの自動読込を許可</span></label>
          <button class="action-button" id="font-load-button" type="button">外部フォントを適用</button>
        </fieldset>
        <fieldset>
          <legend>文書操作</legend>
          <button class="action-button" id="copy-all-button" type="button">本文をコピー</button>
          <button class="action-button" id="download-button" type="button">本文TXTのダウンロード開始</button>
          <button class="action-button" id="download-reader-button" type="button">Reader文書のダウンロード開始</button>
          <button class="action-button" id="download-container-button" type="button">.lyric.txtのダウンロード開始</button>
          <button class="action-button" id="share-button" type="button">共有リンクをコピー</button>
          <label class="url-row"><span>Source URL</span><input id="source-url" type="url" inputmode="url" placeholder="https://…/lyrics.txt" aria-label="Source URL"></label>
          <button class="action-button" id="source-copy-button" type="button">Source URLをコピー</button>
          <button class="action-button" id="url-open-button" type="button">URL本文を開く</button>
          <button class="action-button" id="reload-source-button" type="button">現在のSourceを再読込</button>
        </fieldset>
        <fieldset id="editing-actions">
          <legend>編集操作</legend>
          <button class="action-button" id="undo-button" type="button" disabled>元に戻す</button>
          <button class="action-button" id="redo-button" type="button" disabled>やり直す</button>
          <label><span>Palette Bank</span><select id="palette-bank" aria-label="Palette Bank"><option value="default">default</option></select></label>
          <label><span>Palette Slot</span><select id="palette-slot" aria-label="Palette Slot"><option value="0">Slot 0</option><option value="1">Slot 1</option><option value="2">Slot 2</option><option value="3">Slot 3</option></select></label>
          <label><span>Slot色</span><input id="palette-color" type="color" value="#d02020" aria-label="Palette Slotの色"></label>
          <button class="action-button" id="palette-save-button" type="button">Palette Slotを更新</button>
          <button class="action-button" id="apply-palette-button" type="button">選択範囲へSlotを適用</button>
          <label><span>Style名</span><input id="style-name" type="text" value="shout" pattern="[A-Za-z0-9_-]+" aria-label="Style名"></label>
          <button class="action-button" id="style-button" type="button">選択範囲にStyle</button>
          <label><span>Glyph名</span><input id="glyph-name" type="text" value="hare-special" pattern="[A-Za-z0-9_-]+" aria-label="Glyph名"></label>
          <button class="action-button" id="glyph-button" type="button">選択範囲にGlyph</button>
          <label><span>組文字mode</span><select id="combine-mode" aria-label="組文字mode"><option value="straight">直行</option><option value="parallel">併置</option><option value="z">Z字</option></select></label>
          <button class="action-button" id="combine-button" type="button">選択範囲を組文字</button>
          <button class="action-button" id="clear-presentation-button" type="button">選択範囲の装飾を解除</button>
        </fieldset>
        <nav class="song-links" id="song-links" aria-label="楽曲リンク"></nav>
      </div>
    </aside>

    <footer class="site-footer" id="site-footer"><span>外部データをブラウザ上で読み込んで表示しています</span><nav class="footer-links" id="footer-links" aria-label="楽曲リンク"></nav></footer>
    <div class="drop-overlay" id="drop-overlay" hidden><strong>TXT / .lyric.txt / Reader JSONをドロップ</strong><span>画面のどこに置いても本文を開けます</span></div>
    <script type="module" src="assets/js/app.js?v=20260910-021"></script>
  </body>
</html>
