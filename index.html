<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="外部の歌詞テキストを読むための静的リーダー">
    <title>歌詞リーダー</title>
    <link rel="stylesheet" href="assets/css/reader.css?v=20260907-001">
  </head>
  <body>
    <header class="site-header" id="site-header">
      <a class="site-title" href="./">歌詞リーダー</a>
      <p class="source-status" id="source-status" aria-live="polite">読み込み中…</p>
    </header>

    <main class="reader-shell" id="reader-shell">
      <section class="reader-heading" aria-labelledby="song-title">
        <p class="eyebrow" id="song-artist"></p>
        <h1 id="song-title">歌詞リーダー</h1>
        <p class="song-description" id="song-description"></p>
      </section>
      <details class="source-input" id="source-input">
        <summary>ローカル本文を開く</summary>
        <label class="drop-zone" id="drop-zone" for="source-file"><span>TXTをここへドロップ</span><small>またはファイルを選択</small><input id="source-file" type="file" accept=".txt,text/plain"></label>
        <label class="drop-zone reader-file-zone" for="reader-file"><span>Reader JSONを読み込む</span><small>保存した文書を復元</small><input id="reader-file" type="file" accept=".json,application/json"></label>
        <details class="paste-source"><summary>本文を貼り付ける</summary><textarea id="source-text" rows="4" placeholder="なろう式ルビを含む本文を貼り付け"></textarea><button class="action-button" id="source-text-button" type="button">貼り付けた本文を表示</button></details>
      </details>
      <article class="lyrics" id="lyrics" tabindex="0" aria-label="歌詞本文"></article>
      <p class="reader-error" id="reader-error" role="alert" hidden></p>
    </main>

    <aside class="settings" id="settings" aria-label="表示設定">
      <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">表示設定</button>
      <div class="settings-panel" id="settings-panel" hidden>
        <fieldset>
          <legend>本文</legend>
          <label><span>仮名</span><select id="kana-mode"><option value="historical">歴史的仮名遣</option><option value="modern">現代仮名</option></select></label>
          <label><span>字体</span><select id="kanji-mode"><option value="original">原字</option><option value="shinjitai">新字体</option></select></label>
          <label class="check-row"><input id="ruby-toggle" type="checkbox" checked><span>ルビを表示</span></label>
          <label class="check-row"><input id="vertical-toggle" type="checkbox"><span>縦書き</span></label>
        </fieldset>
        <fieldset>
          <legend>文字サイズ</legend>
          <div class="size-controls"><button id="size-decrease" type="button" aria-label="文字を小さく">A−</button><output id="size-value">20px</output><button id="size-increase" type="button" aria-label="文字を大きく">A＋</button></div>
          <input id="size-range" type="range" min="14" max="32" step="1" value="20" aria-label="文字サイズ">
        </fieldset>
        <fieldset>
          <legend>配色</legend>
          <label><span>背景色</span><input id="background-color" type="color" value="#f5f0e6" aria-label="背景色"></label>
          <label><span>本文色</span><input id="text-color" type="color" value="#272522" aria-label="本文色"></label>
          <label><span>ルビ色</span><input id="ruby-color" type="color" value="#716b60" aria-label="ルビ色"></label>
        </fieldset>
        <fieldset>
          <legend>フォント</legend>
          <label><span>書体</span><select id="font-family" aria-label="書体">
            <option value="serif">明朝</option>
            <option value="sans">ゴシック</option>
            <option value="mono">等幅</option>
            <option value="yu-mincho">游明朝</option>
            <option value="noto-serif">Noto Serif JP</option>
            <option value="noto-sans">Noto Sans JP</option>
            <option value="nishiki-teki">Nishiki-teki</option>
            <option value="custom">外部フォント</option>
          </select></label>
          <label class="font-url-row"><span>フォントURL</span><input id="font-url" type="url" inputmode="url" placeholder="https://…/font.woff2" aria-label="外部フォントURL"></label>
          <button class="action-button" id="font-load-button" type="button">外部フォントを適用</button>
        </fieldset>
        <fieldset>
          <legend>操作</legend>
          <button class="action-button" id="copy-button" type="button">原文記法でコピー</button>
          <button class="action-button" id="download-button" type="button">本文を下載</button>
          <button class="action-button" id="download-reader-button" type="button">Reader文書を保存</button>
          <label class="annotation-color"><span>選択範囲の色</span><input id="annotation-color" type="color" value="#d02020" aria-label="選択範囲の色"></label>
          <button class="action-button" id="annotate-button" type="button">選択範囲を着色</button>
        </fieldset>
        <nav class="song-links" id="song-links" aria-label="楽曲リンク"></nav>
      </div>
    </aside>

    <footer class="site-footer" id="site-footer"><span>外部データをブラウザ上で読み込んで表示しています</span><nav class="footer-links" id="footer-links" aria-label="楽曲リンク"></nav></footer>
    <script type="module" src="assets/js/app.js?v=20260907-001"></script>
  </body>
</html>
